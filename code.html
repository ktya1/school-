{% extends 'base.html' %}

{% block title %} POSTS {% endblock %}

{% block links %}
<style>
    /* Сетка/список постов */
    .posts-container {
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    /* Карточка одного поста */
    .post {
        background-color: #faf7f2;
        border: 1px solid #c9a876;
        border-left: 5px solid #c9a876;
        border-radius: 14px;
        padding: 24px 30px;
        box-shadow: 0 4px 16px rgba(56, 42, 33, 0.05);
        transition: all 0.25s ease;
    }

    /* Эффект при наведении */
    .post:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(56, 42, 33, 0.1);
        border-left-color: #382a21;
    }

    /* Заголовок породы/поста */
    .post h2 {
        color: #382a21;
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
        position: relative;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(201, 168, 118, 0.25);
    }

    /* Текст описания */
    .post p {
        color: #382a21;
        font-size: 1.05rem;
        line-height: 1.65;
        font-weight: 400;
        white-space: pre-line;
    }

    /* Заглушка, если постов нет */
    .empty-posts {
        text-align: center;
        color: #8a7362;
        font-size: 1.15rem;
        font-style: italic;
        padding: 60px 20px;
        border: 2px dashed #c9a876;
        border-radius: 16px;
        background-color: rgba(240, 229, 211, 0.35);
    }

    @media (max-width: 600px) {
        .post {
            padding: 18px 20px;
        }

        .post h2 {
            font-size: 1.3rem;
        }

        .post p {
            font-size: 0.95rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="posts-container">
    {% for post in posts %}
        <article class="post">
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
        </article>
    {% else %}
        <p class="empty-posts">постов нет</p>
    {% endfor %}
</div>
{% endblock %}
