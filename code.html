<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лошади — Грация и Породы</title>
    <style>
        /* Сброс базовых отступов */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0e5d3;
            color: #382a21;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Главная карточка хедера */
        header {
            width: 100%;
            max-width: 960px;
            background-color: #ffffff;
            border: 1px solid #c9a876;
            border-radius: 20px;
            padding: 35px 40px;
            box-shadow: 0 12px 32px rgba(56, 42, 33, 0.08);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Верхняя часть: текст слева, фото справа */
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        /* Заголовок-название слева */
        header h5 {
            flex: 1;
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.5;
            color: #382a21;
            text-align: left;
            position: relative;
            padding-left: 18px;
            border-left: 3px solid #c9a876; /* Акцентная линия слева */
        }

        /* Фотография справа */
        .header-img {
            width: 320px;
            height: 200px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #c9a876;
            box-shadow: 0 6px 18px rgba(56, 42, 33, 0.1);
        }

        /* Нижняя часть: блок с кнопками */
        .nav-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            padding-top: 25px;
            border-top: 1px solid rgba(201, 168, 118, 0.35); /* Разделительная черта сверху */
        }

        /* Общие стили кнопок-ссылок */
        header a {
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        /* 1. Главная кнопка: Создать новую породу */
        header a:nth-of-type(1) {
            background-color: #382a21;
            color: #f0e5d3;
            border: 2px solid #382a21;
        }

        header a:nth-of-type(1):hover {
            background-color: #c9a876;
            border-color: #c9a876;
            color: #382a21;
        }

        /* 2. Второстепенная кнопка: Изменить данные */
        header a:nth-of-type(2) {
            background-color: transparent;
            color: #382a21;
            border: 2px solid #c9a876;
        }

        header a:nth-of-type(2):hover {
            background-color: #f0e5d3;
        }

        /* 3. Кнопка удаления */
        header a:nth-of-type(3) {
            background-color: transparent;
            color: #8a3b3b;
            border: 2px solid rgba(138, 59, 59, 0.35);
            margin-left: auto; /* Отодвигает кнопку удаления в правый край */
        }

        header a:nth-of-type(3):hover {
            background-color: #8a3b3b;
            color: #ffffff;
            border-color: #8a3b3b;
        }

        /* Адаптив для планшетов и смартфонов */
        @media (max-width: 768px) {
            header {
                padding: 25px 20px;
            }

            .header-top {
                flex-direction: column-reverse; /* На мобилках фото сверху, текст под ним */
                gap: 20px;
            }

            .header-img {
                width: 100%;
                height: 200px;
            }

            header h5 {
                font-size: 1.25rem;
                padding-left: 14px;
            }

            .nav-actions {
                flex-direction: column;
                align-items: stretch;
            }

            header a,
            header a:nth-of-type(3) {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- Верхний ряд: Текст слева, Фото справа -->
        <div class="header-top">
            <h5>лошади - это грация в каждом движении. Это необыкновенно и уникально</h5>
            <img src="https://avatars.mds.yandex.net/i?id=612f92c3f0d96691fcd2302f2c30514c_l-5333380-images-thumbs&n=13" alt="Лошади" class="header-img">
        </div>

        <!-- Нижний ряд: Кнопки действий -->
        <div class="nav-actions">
            <a href="">создать новую породу</a>
            <a href="">изменить данные о породе</a>
            <a href="">удалить породу</a>
        </div>
    </header>

</body>
</html>
