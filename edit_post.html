<style>
    /* Форма */
    form {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 30px;
        background-color: #faf7f2;
        border: 1px solid #c9a876;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(56, 42, 33, 0.08);
        box-sizing: border-box;
    }

    /* Подписи и поля */
    .lbl {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
        color: #382a21;
        font-size: 1rem;
        font-weight: 600;
    }

    /* Поля ввода */
    .lbl input {
        width: 100%;
        min-height: 46px;
        padding: 12px 14px;
        color: #382a21;
        background-color: #ffffff;
        border: 1px solid #c9a876;
        border-radius: 10px;
        outline: none;
        font: inherit;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Поле в фокусе */
    .lbl input:focus {
        border-color: #382a21;
        box-shadow: 0 0 0 3px rgba(201, 168, 118, 0.3);
    }

    /* Кнопка сохранения */
    .submit {
        width: 100%;
        margin-top: 8px;
        padding: 13px 20px;
        color: #f0e5d3;
        background-color: #382a21;
        border: 2px solid #382a21;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .submit:hover {
        color: #382a21;
        background-color: #c9a876;
        border-color: #c9a876;
    }

    /* Адаптивность */
    @media (max-width: 600px) {
        form {
            padding: 22px 18px;
        }

        .lbl {
            font-size: 0.95rem;
        }
    }
</style>

<form method="post">
    <label class="lbl">
        Содержание: 
        <input type="text" name="content" value="{{post.content}}">
    </label>

    <label class="lbl">
        Полное содержание: 
        <input type="text" name="full_content" value="{{post.full_content}}">
    </label>

    <button class="submit" type="submit">Сохранить</button>
</form>
