<style>
    /* Форма создания поста */
    .post_form {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 30px;
        background-color: #faf7f2;
        border: 1px solid #c9a876;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(56, 42, 33, 0.08);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* Метка (заголовок поля) */
    .post_form label {
        color: #382a21;
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 2px;
    }

    /* Поле ввода */
    .post_form .inp {
        width: 100%;
        min-height: 48px;
        padding: 12px 16px;
        color: #382a21;
        background-color: #ffffff;
        border: 1px solid #c9a876;
        border-radius: 10px;
        outline: none;
        font: inherit;
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Состояние фокуса у поля ввода */
    .post_form .inp:focus {
        border-color: #382a21;
        box-shadow: 0 0 0 3px rgba(201, 168, 118, 0.3);
    }

    /* Кнопка публикации */
    .post_form .submit_btn {
        width: 100%;
        margin-top: 8px;
        padding: 13px 20px;
        color: #f0e5d3;
        background-color: #382a21;
        border: 2px solid #382a21;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .post_form .submit_btn:hover {
        color: #382a21;
        background-color: #c9a876;
        border-color: #c9a876;
    }

    /* Адаптивность для мобильных устройств */
    @media (max-width: 600px) {
        .post_form {
            padding: 22px 18px;
        }

        .post_form label {
            font-size: 0.95rem;
        }
    }
</style>

<form action="/posts/create" method="POST" class="post_form">
  <label for="all">Текст поста:</label>
  <input class="inp" id="all" name="all">
  <button type="submit" class="submit_btn">Опубликовать</button>
</form>
