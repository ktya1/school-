<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лошади — Грация и Породы</title>
    <style>
        /* Сброс базовых отступов */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0e5d3;
            color: #382a21;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        /* Оформление хедера в виде стильной благородной плашки */
        header {
            width: 100%;
            max-width: 960px;
            background: #ffffff;
            border: 1px solid #c9a876;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(56, 42, 33, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
        }

        /* Заголовок-слоган */
        header h5 {
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.6;
            color: #382a21;
            max-width: 700px;
            position: relative;
            padding-bottom: 20px;
        }

        /* Тонкая золотистая черта-разделитель */
        header h5::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background-color: #c9a876;
            border-radius: 2px;
        }

        /* Блок навигационных кнопок */
        .nav-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            width: 100%;
        }

        /* Базовый стиль кнопок-ссылок */
        header a {
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 13px 24px;
            border-radius: 12px;
            letter-spacing: 0.3px;
            transition: all 0.2s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. Главная кнопка: Создать новую породу */
        header a:nth-of-type(1) {
            background-color: #382a21;
            color: #f0e5d3;
            border: 2px solid #382a21;
        }

        header a:nth-of-type(1):hover {
            background-color: #c9a876;
            border-color: #c9a876;
            color: #382a21;
            transform: translateY(-2px);
        }

        /* 2. Второстепенная кнопка: Изменить данные */
        header a:nth-of-type(2) {
            background-color: transparent;
            color: #382a21;
            border: 2px solid #c9a876;
        }

        header a:nth-of-type(2):hover {
            background-color: #f0e5d3;
            transform: translateY(-2px);
        }

        /* 3. Опасное действие: Удалить породу */
        header a:nth-of-type(3) {
            background-color: transparent;
            color: #8a3b3b;
            border: 2px solid rgba(138, 59, 59, 0.35);
        }

        header a:nth-of-type(3):hover {
            background-color: #8a3b3b;
            color: #ffffff;
            border-color: #8a3b3b;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            header {
                padding: 30px 20px;
            }
            header h5 {
                font-size: 1.15rem;
            }
            .nav-actions {
                flex-direction: column;
                width: 100%;
            }
            header a {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h5>лошади - это грация в каждом движении. Это необыкновенно и уникально</h5>

        <div class="nav-actions">
            <a href="">создать новую породу</a>
            <a href="">изменить данные о породе</a>
            <a href="">удалить породу</a>
        </div>
    </header>

</body>
</html>
